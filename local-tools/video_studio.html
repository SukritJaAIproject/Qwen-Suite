<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Qwen Video Studio</title>
  <style>
    :root{color-scheme:dark;--bg:#070913;--panel:#111525;--panel2:#171c30;--ink:#f7f8ff;--muted:#98a2bf;--line:rgba(148,163,184,.16);--purple:#8b5cf6;--pink:#ec4899;--cyan:#22d3ee;--green:#34d399;--red:#fb7185}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 0%,rgba(139,92,246,.19),transparent 30%),radial-gradient(circle at 95% 18%,rgba(34,211,238,.11),transparent 26%),var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",Tahoma,sans-serif}
    .shell{width:min(1420px,calc(100% - 32px));margin:auto;padding:28px 0 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:15px}.logo{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(135deg,var(--purple),var(--pink));box-shadow:0 18px 45px rgba(139,92,246,.28);font-size:25px}.title h1{font-size:24px;margin:0 0 4px}.title p{margin:0;color:var(--muted);font-size:13px}.health{display:flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(17,21,37,.82);color:#cbd5e1;font-size:12px}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 16px var(--green)}
    .grid{display:grid;grid-template-columns:minmax(370px,460px) minmax(0,1fr);gap:20px}.card{border:1px solid var(--line);border-radius:24px;background:linear-gradient(160deg,rgba(23,28,48,.96),rgba(13,17,31,.96));box-shadow:0 25px 70px rgba(0,0,0,.28);overflow:hidden}.card-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.card-head h2{font-size:15px;margin:0}.badge{padding:6px 10px;border-radius:999px;background:rgba(139,92,246,.13);color:#c4b5fd;font-size:11px;font-weight:700}.form{padding:22px;display:grid;gap:16px}.field{display:grid;gap:7px}.field label{font-size:12px;font-weight:700;color:#cbd5e1}.field small{color:var(--muted);font-size:11px}.field textarea,.field input,.field select{width:100%;border:1px solid rgba(148,163,184,.18);border-radius:13px;background:#0b0e19;color:var(--ink);padding:12px 13px;outline:none;font:inherit}.field textarea{min-height:145px;resize:vertical;line-height:1.55}.field textarea:focus,.field input:focus,.field select:focus{border-color:rgba(139,92,246,.72);box-shadow:0 0 0 3px rgba(139,92,246,.12)}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.preset-row{display:flex;gap:8px;flex-wrap:wrap}.preset{border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.025);color:#cbd5e1;padding:7px 10px;font-size:11px;cursor:pointer}.preset:hover{border-color:rgba(139,92,246,.58);color:#fff}.start{height:50px;border:0;border-radius:15px;color:#fff;font-weight:800;font-size:14px;cursor:pointer;background:linear-gradient(135deg,var(--purple),var(--pink));box-shadow:0 18px 35px rgba(139,92,246,.22);transition:.18s}.start:hover{transform:translateY(-1px);filter:brightness(1.08)}.start:disabled{opacity:.55;cursor:wait;transform:none}.hint{display:flex;gap:10px;padding:13px;border-radius:14px;background:rgba(34,211,238,.07);border:1px solid rgba(34,211,238,.13);color:#b8cad9;font-size:11px;line-height:1.55}
    .jobs{padding:14px;display:grid;gap:12px;max-height:780px;overflow:auto}.job{padding:17px;border:1px solid var(--line);border-radius:18px;background:rgba(7,9,19,.52)}.job-top{display:flex;justify-content:space-between;gap:16px}.job-title{font-weight:750;font-size:14px;margin-bottom:5px}.meta{color:var(--muted);font-size:11px;line-height:1.55}.status{height:26px;padding:0 10px;border-radius:999px;display:flex;align-items:center;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;background:rgba(148,163,184,.11);color:#cbd5e1;white-space:nowrap}.status.running{color:#bae6fd;background:rgba(14,165,233,.14)}.status.completed{color:#a7f3d0;background:rgba(16,185,129,.13)}.status.failed{color:#fecdd3;background:rgba(244,63,94,.14)}.progress{height:9px;border-radius:999px;background:#090c17;overflow:hidden;margin:14px 0 9px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--cyan));border-radius:inherit;transition:width .5s}.message{font-size:12px;color:#d6dbeb;white-space:pre-wrap;word-break:break-word}.path{margin-top:10px;padding:9px 10px;border-radius:10px;background:#090c17;color:#aeb8d0;font:11px/1.45 Consolas,monospace;word-break:break-all}.actions{display:flex;gap:8px;margin-top:12px}.actions button{border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.035);color:#d8def0;padding:7px 10px;font-size:11px;cursor:pointer}.actions button:hover{border-color:rgba(139,92,246,.55)}.empty{padding:64px 20px;text-align:center;color:var(--muted)}.toast{position:fixed;right:20px;top:20px;z-index:20;padding:13px 16px;border:1px solid var(--line);border-radius:13px;background:#171c30;color:#fff;box-shadow:0 18px 50px rgba(0,0,0,.4);opacity:0;transform:translateY(-10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.toast.error{border-color:rgba(251,113,133,.42)}
    @media(max-width:900px){.grid{grid-template-columns:1fr}.shell{width:min(100% - 20px,700px);padding-top:16px}.top{align-items:flex-start}.health{display:none}.jobs{max-height:none}}@media(max-width:520px){.row{grid-template-columns:1fr}.card{border-radius:18px}.shell{width:100%;padding:10px}.title h1{font-size:20px}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand"><div class="logo">▶</div><div class="title"><h1>Qwen Video Studio</h1><p>Prompt เดียว → Storyboard → Voice → Render → QA → MP4</p></div></div>
      <div class="health"><span class="dot"></span><span id="healthText">ระบบพร้อมทำงาน</span></div>
    </header>
    <main class="grid">
      <section class="card">
        <div class="card-head"><h2>สร้างวิดีโอใหม่</h2><span class="badge">ONE‑CLICK</span></div>
        <form class="form" id="videoForm">
          <div class="field"><label for="project">Project</label><select id="project" required></select></div>
          <div class="field">
            <label for="prompt">อธิบายวิดีโอที่ต้องการ</label>
            <textarea id="prompt" required placeholder="ตัวอย่าง: สร้างวิดีโอสอนภาษาอังกฤษ A–Z สำหรับเด็ก ภาพสวยทันสมัย มีเสียงบรรยายและเพลงเบา ๆ"></textarea>
            <div class="preset-row"><button class="preset" type="button" data-prompt="สร้างวิดีโอสอนภาษาอังกฤษสำหรับเด็ก ภาพสดใส เข้าใจง่าย มีแบบฝึกพูดตามและสรุปท้ายคลิป">สื่อการสอน</button><button class="preset" type="button" data-prompt="สร้างวิดีโออธิบายผลิตภัณฑ์อย่างมืออาชีพ เริ่มด้วยปัญหา ตามด้วยประโยชน์ วิธีใช้ และสรุปชวนลงมือทำ">แนะนำสินค้า</button><button class="preset" type="button" data-prompt="สร้างวิดีโอเล่าเรื่องแบบ cinematic มีจุดเริ่มต้น ความท้าทาย จุดเปลี่ยน และบทสรุปที่น่าจดจำ">เล่าเรื่อง</button></div>
          </div>
          <div class="row"><div class="field"><label for="duration">ความยาว (วินาที)</label><input id="duration" type="number" min="8" max="3600" value="60"></div><div class="field"><label for="aspect">อัตราส่วน</label><select id="aspect"><option>9:16</option><option>16:9</option><option>1:1</option></select></div></div>
          <div class="row"><div class="field"><label for="style">สไตล์</label><select id="style"><option value="premium">Premium</option><option value="education">Education</option><option value="cinematic">Cinematic</option><option value="corporate">Corporate</option><option value="playful">Playful</option><option value="minimal">Minimal</option></select></div><div class="field"><label for="language">ภาษา</label><select id="language"><option value="auto">Auto</option><option value="thai">ไทย</option><option value="english">English</option></select></div></div>
          <div class="field"><label for="outputName">ชื่อไฟล์ (เว้นว่างเพื่อสร้างอัตโนมัติ)</label><input id="outputName" placeholder="my_video.mp4"><small>ไฟล์จะถูกบันทึกในโฟลเดอร์ outputs ของ Project</small></div>
          <button class="start" id="startButton" type="submit">สร้างวิดีโอทันที</button>
          <div class="hint"><span>⚡</span><span>ระบบจะทำต่อเองแม้ปิดหน้าต่างนี้ พร้อม retry/resume จาก checkpoint และตรวจไฟล์ก่อนแจ้งว่าเสร็จ</span></div>
        </form>
      </section>
      <section class="card">
        <div class="card-head"><h2>Video Jobs</h2><span class="badge" id="runningBadge">0 RUNNING</span></div>
        <div class="jobs" id="jobs"><div class="empty">กำลังโหลดงาน…</div></div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let state={projects:[],jobs:[]};
    function toast(message,error=false){const el=$('#toast');el.textContent=message;el.className='toast show'+(error?' error':'');clearTimeout(el.timer);el.timer=setTimeout(()=>el.className='toast',3200)}
    function jobHtml(job){const status=job.status||'queued',pct=Number(job.progress_percent||0),task=job.task||{};const output=job.output_path||'';return `<article class="job"><div class="job-top"><div><div class="job-title">${esc(job.title)}</div><div class="meta">${esc(job.project)} · ${esc(job.aspect_ratio)} · ${esc(job.duration_seconds)} วินาที · attempt ${esc(job.attempt||1)}<br>Task: ${esc(job.task_id||'-')} ${task.status?`· ${esc(task.status)}`:''}</div></div><span class="status ${esc(status)}">${esc(status)}</span></div><div class="progress"><i style="width:${Math.max(0,Math.min(100,pct))}%"></i></div><div class="message">${esc(job.message||job.phase||'')}</div>${output?`<div class="path">${esc(output)}</div>`:''}<div class="actions"><button type="button" onclick="copyText('${esc(output).replace(/'/g,'\\\'')}')">คัดลอก Path</button>${status==='failed'?`<button type="button" onclick="retryJob('${esc(job.id)}')">Retry / Resume</button>`:''}${job.report_path?`<button type="button" onclick="copyText('${esc(job.report_path).replace(/'/g,'\\\'')}')">คัดลอก Report</button>`:''}</div></article>`}
    function render(){const select=$('#project'),selected=select.value;select.innerHTML=state.projects.map(p=>`<option value="${esc(p.slug||p.name)}">${esc(p.name||p.slug)}</option>`).join('');if([...select.options].some(o=>o.value===selected))select.value=selected;const running=state.jobs.filter(j=>j.status==='running'||j.status==='queued').length;$('#runningBadge').textContent=`${running} RUNNING`;$('#jobs').innerHTML=state.jobs.length?state.jobs.map(jobHtml).join(''):'<div class="empty">ยังไม่มีงานวิดีโอ เริ่มสร้างจากแบบฟอร์มด้านซ้ายได้เลย</div>'}
    async function load(){try{const r=await fetch('/video-studio/api/state',{cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||`HTTP ${r.status}`);state=d;render();$('#healthText').textContent='ระบบพร้อมทำงาน'}catch(e){$('#healthText').textContent='เชื่อมต่อไม่ได้';toast(e.message,true)}}
    async function retryJob(id){try{const r=await fetch(`/video-studio/api/jobs/${encodeURIComponent(id)}/retry`,{method:'POST'});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||`HTTP ${r.status}`);toast('เริ่ม Retry/Resume แล้ว');load()}catch(e){toast(e.message,true)}}
    async function copyText(value){try{await navigator.clipboard.writeText(value);toast('คัดลอกแล้ว')}catch{toast('คัดลอกไม่สำเร็จ',true)}}
    $('#videoForm').addEventListener('submit',async e=>{e.preventDefault();const button=$('#startButton');button.disabled=true;button.textContent='กำลังเริ่มงาน…';try{const payload={project:$('#project').value,prompt:$('#prompt').value,duration_seconds:Number($('#duration').value),aspect_ratio:$('#aspect').value,style:$('#style').value,language:$('#language').value,output_name:$('#outputName').value};const r=await fetch('/video-studio/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||`HTTP ${r.status}`);toast('เริ่มสร้างวิดีโอแล้ว ระบบจะทำต่ออัตโนมัติ');$('#prompt').value='';load()}catch(err){toast(err.message,true)}finally{button.disabled=false;button.textContent='สร้างวิดีโอทันที'}});
    document.querySelectorAll('[data-prompt]').forEach(b=>b.addEventListener('click',()=>$('#prompt').value=b.dataset.prompt));
    load();setInterval(load,3000);
  </script>
</body>
</html>
